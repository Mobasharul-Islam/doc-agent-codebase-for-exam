# THE place you set models & parameters. Code reads only from here.
seed: 42
device: cuda

enhance:   {enabled: true,  model: "unet_small", type: "diffusion"}   # or "vae" / "none"
layout:    {model: "detectron2:layout", score_thr: 0.5, backend: "classical"}   # classical = OpenCV line segmentation (detectron2 not required)
ocr:       {model: "microsoft/trocr-base-printed", finetune: true, backend: "auto"}   # auto = <page_id>.txt sidecar if present else TrOCR; or "sidecar" / "trocr"
embed:     {model: "sentence-transformers/all-MiniLM-L6-v2", dim: 384}
index:     {type: "faiss:flat", chunk_tokens: 48, overlap: 8}   # "faiss:hnsw" for big corpora - but faiss-cpu 1.8 HNSW segfaults on this Windows box (even in a bare script)
retrieve:  {k: 10, k_step: 10, k_max: 40, weak_threshold: 0.35, rerank: true, reranker: "cross-encoder/ms-marco-MiniLM-L6-v2"}   # k_step/k_max/weak_threshold drive evidence-gated re-search
agent:     {max_steps: 8, autonomy: "act-with-approval", budget_usd: 0.05, llm_model: "claude-haiku-5-5", n_context: 4, cost_per_call_usd: 0.001}   # no LLM key in .env -> offline extractive fallback
rl:        {algo: "ppo", train_policy: false}                         # bonus: set true
serve:     {batch: true}
deploy:    {target: "hf-spaces"}
adapt:     {lora: {r: 8, alpha: 16, dropout: 0.05, target_modules: ["query", "value"]}, quant: {dtype: "qint8"}}
train:     {epochs: 3, batch_size: 16, lr: 0.001, patch: 64, patches_per_page: 32}
data:      {raw_dir: "data/raw", interim_dir: "data/interim", index_dir: "data/index", models_dir: "models", reports_dir: "reports", trace_path: "traces/run.jsonl"}
